# prometheus.yml
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'rag-core-service'
    static_configs:
      # ✅ آدرس سرویس FastAPI خود را اینجا وارد کنید
      # اگر FastAPI روی سیستم میزبان (host) اجرا می‌شود و نه در داکر،
      # از 'host.docker.internal:8000' استفاده کنید.
      - targets: ['host.docker.internal:8000']